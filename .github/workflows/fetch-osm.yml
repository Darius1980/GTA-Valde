name: Fetch map data
on:
  push:
    paths: [tools/fetch_data.py, .github/workflows/fetch-osm.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyproj
      - run: python tools/fetch_data.py data
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: map extract of Val de Santa María" || exit 0
          git push
