name: Fetch OSM data
on:
  push:
    paths: [tools/fetch_osm.sh, .github/workflows/fetch-osm.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/fetch_osm.sh data
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/osm.json
          git commit -m "data: OSM extract of Val de Santa María" || exit 0
          git push
